<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: transparent;
            color: #142921;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.65;
            margin: 0;
            padding: 4px 2px;
            word-wrap: break-word;
            -webkit-font-smoothing: antialiased;
        }
        .math-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .katex-display {
            margin: 0.6em 0 !important;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 6px 0;
            color: #0E3529;
        }
        .katex {
            font-size: 1.12em;
        }
        .cloze-occluded {
            display: inline-block;
            background: rgba(33, 95, 71, 0.08);
            border: 1.5px dashed rgba(33, 95, 71, 0.6);
            border-radius: 8px;
            padding: 2px 12px;
            margin: 0 4px;
            color: #215F47;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s ease;
        }
        .cloze-occluded:hover {
            background: rgba(33, 95, 71, 0.16);
        }
        .cloze-revealed {
            display: inline-block;
            background: rgba(75, 138, 108, 0.14);
            border: 1.5px solid #215F47;
            border-radius: 8px;
            padding: 2px 10px;
            margin: 0 4px;
            color: #0E3529;
            font-weight: 700;
            animation: fadeIn 0.3s ease-in-out;
        }
        .highlight-term {
            background-color: rgba(185, 141, 74, 0.15);
            color: #142921;
            border-bottom: 1.5px solid #B98D4A;
            padding: 1px 4px;
            border-radius: 3px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="content" class="math-container"></div>

    <script>
        function renderMath(rawContent) {
            const container = document.getElementById('content');
            container.innerHTML = rawContent;
            
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            }
            
            if (window.AndroidBridge && window.AndroidBridge.onContentHeight) {
                setTimeout(() => {
                    const height = document.body.scrollHeight;
                    window.AndroidBridge.onContentHeight(height);
                }, 50);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            if (window.pendingContent) {
                renderMath(window.pendingContent);
            }
        });
    </script>
</body>
</html>
